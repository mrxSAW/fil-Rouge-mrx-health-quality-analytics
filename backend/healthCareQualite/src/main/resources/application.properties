spring.application.name=healthCareQualite

spring.datasource.url=jdbc:mysql://localhost:3306/health_quality_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.jwt.secret=health-quality-analytics-secret-key-development-2026
app.jwt.expiration-ms=86400000


springdoc.swagger-ui.path=/swagger-ui.html



logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG


spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=health-quality::



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true